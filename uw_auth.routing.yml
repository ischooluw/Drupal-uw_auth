uw_auth.uw_auth_settings_form:
  path: '/admin/config/uw_auth/settings'
  defaults:
    _form: '\Drupal\uw_auth\Form\SettingsForm'
    _title: 'SettingsForm'
  requirements:
    _permission: 'administer uw auth'
  options:
    _admin_route: TRUE

uw_auth.login:
  path: '/uwlogin'
  defaults:
    _controller: '\Drupal\uw_auth\Controller\UWLoginController::login'
    _title: 'UW Login'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
    _auth:
      - cookie
      - uw_auth
